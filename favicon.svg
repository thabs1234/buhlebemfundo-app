<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="yell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#d49a00"/>
    </linearGradient>
  </defs>
  <!-- App icon background: yellow rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#yell)"/>

  <!-- SHIELD (dolphin shield) — dark blue rounded shield behind the logo -->
  <path d="M256 90
           C150 90, 90 152, 90 256
           C90 348, 170 420, 256 420
           C342 420, 422 348, 422 256
           C422 152, 352 90, 256 90 Z"
        fill="#14213d"/>

  <!-- DORSAL FIN (dolphin graphic) — stylized dolphin breaking the surface -->
  <!-- Water line (light blue) -->
  <path d="M140 350 Q200 330, 256 350 Q312 370, 372 350"
        fill="none" stroke="#8ab4f8" stroke-width="6" stroke-linecap="round"/>
  <!-- Dolphin body — lighter blue so it reads against the dark shield -->
  <path d="M165 310
           C165 268, 225 248, 282 268
           C322 280, 350 300, 350 318
           C350 342, 316 348, 280 345
           C250 342, 228 330, 212 320
           C192 310, 165 310, 165 310 Z"
        fill="#3d7fd1"/>
  <!-- Dolphin eye -->
  <circle cx="202" cy="292" r="7" fill="#14213d"/>
  <!-- Dolphin belly (lighter highlight) -->
  <path d="M190 324 Q240 335, 285 330 Q325 325, 345 314"
        fill="none" stroke="#6fa8dc" stroke-width="3" stroke-linecap="round"/>
  <!-- Tail fin (clearly visible) -->
  <path d="M165 310 Q140 300, 135 320 Q140 342, 165 335 Z" fill="#3d7fd1"/>
  <!-- Dorsal fin on top of body -->
  <path d="M240 268 Q250 240, 268 250 Q258 268, 248 270 Z" fill="#3d7fd1"/>

  <!-- LIGHTBULB (above dolphin, inside shield) — glowing bulb with filament -->
  <!-- Bulb glass -->
  <path d="M256 130
           C300 130, 330 165, 330 200
           C330 230, 300 250, 256 250
           C212 250, 182 230, 182 200
           C182 165, 212 130, 256 130 Z"
        fill="#fff8e1" stroke="#f5c518" stroke-width="4"/>
  <!-- Bulb base (screw cap) -->
  <rect x="240" y="250" width="32" height="14" rx="4" fill="#f5c518"/>
  <rect x="244" y="264" width="24" height="6" rx="2" fill="#f5c518"/>
  <!-- Filament (glowing) -->
  <path d="M240 200 Q240 230, 256 235 Q272 230, 272 200"
        fill="none" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
  <!-- Light rays -->
  <g stroke="#f5c518" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="118" x2="256" y2="108"/>
    <line x1="294" y1="136" x2="304" y2="126"/>
    <line x1="218" y1="136" x2="208" y2="126"/>
    <line x1="322" y1="180" x2="338" y2="172"/>
    <line x1="190" y1="180" x2="174" y2="172"/>
  </g>
  <!-- Glow ring -->
  <circle cx="256" cy="190" r="70" fill="none" stroke="#f5c518" stroke-width="2" opacity="0.35"/>

  <!-- AB CREST (monogram) — accent on lower shield -->
  <text x="256" y="390" text-anchor="middle" font-family="Georgia, serif"
        font-size="48" font-weight="700" fill="#f5c518" letter-spacing="2">AB</text>
</svg>
